[build]
  base = "web"
  command = "cd .. && npm ci && npm run build -w web"
  publish = "dist/studio-web/browser"

[[redirects]]
  from = "/api/*"
  to = "https://sticklaugh-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200